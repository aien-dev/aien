[package]
name = "allen-guard"
version = "0.1.0"
description = "Allen programme close guard and source-control guard"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "allen_guard"
path = "src/lib.rs"

[[bin]]
name = "allen-guard"
path = "src/main.rs"

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
